services:
  mongo:
    image: mongo:7.0
    # Single-node replica set so multi-document transactions work.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    ports: ["8000:8000"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
